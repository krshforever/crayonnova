<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Still a Rough Sketch — Crayon Nova</title>
<meta name="description" content="That page is still a rough sketch. Head back to the crayon box.">
<meta name="theme-color" content="#0b0e1a">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=3">
<script>document.documentElement.className += " js";</script>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
  </defs>
</svg>

<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>

<main class="notfound">
  <div class="card sketch">
    <p class="code">404</p>
    <h1 style="font-size:1.6rem;letter-spacing:-0.02em">This page is still <span class="hand" style="color:var(--accent);font-size:1.4em">a rough sketch.</span></h1>
    <p>We know roughly what it should be. We just haven't finished drawing it. Head back to the box — the crayons are all there, we promise.</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="index.html">Back to the crayon box</a>
      <a class="btn btn-ghost" href="sketch-lab.html">Draw your own page</a>
    </div>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js?v=2" defer></script>
</body>
</html>
